name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  quality:
    name: 前端 / MCP / C++ 格式与 workflow 检查
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 检查 workflow（actionlint 1.7.12）
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-format.txt

      - name: 安装格式工具与前端依赖
        run: |
          python -m pip install -r scripts/requirements-format.txt
          pnpm install --frozen-lockfile

      - name: 前端 / MCP / workflow 格式检查（Prettier）
        run: pnpm format:check

      - name: C++ 格式检查（clang-format 20.1.8）
        shell: bash
        run: |
          git ls-files -z -- '*.c' '*.h' '*.cpp' '*.hpp' '*.cc' '*.hh' '*.cxx' '*.hxx' | xargs -0 clang-format --dry-run --Werror

  fast:
    name: 前端 / MCP / Rust 客户端：编译、单元测试与格式
    needs: [frontend, client]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 核对并行检查结果
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          CLIENT_RESULT: ${{ needs.client.result }}
        run: test "$FRONTEND_RESULT" = success && test "$CLIENT_RESULT" = success

  client:
    name: Windows Rust 客户端 / 运行库契约
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 运行库 NuGet 契约检查
        shell: pwsh
        run: |
          ./tests/release/test-runtime-nuget.ps1
          ./tests/release/test-runtime-nuget-publish.ps1

      - name: 安装 Rust 工具链
        shell: pwsh
        run: |
          $channel = (Select-String -LiteralPath rust-toolchain.toml -Pattern '^channel\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          rustup toolchain install $channel --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { throw 'Rust 工具链安装失败' }

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/lyflow-client
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Rust 格式检查（bridge 与客户端）
        run: cargo fmt --manifest-path bridge/Cargo.toml --all -- --check

      - name: Rust 格式检查（运行库探针）
        run: cargo fmt --manifest-path tests/release/probe/Cargo.toml -- --check

      - name: Rust 客户端编译
        run: cargo build --locked --manifest-path crates/lyflow-client/Cargo.toml

      - name: Rust 客户端单元测试
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build/ci -Force | Out-Null
          cargo test --locked --manifest-path crates/lyflow-client/Cargo.toml --lib 2>&1 | Tee-Object -FilePath build/ci/client-test.log
          if ($LASTEXITCODE -ne 0) { throw "Rust 客户端单元测试失败 (exit $LASTEXITCODE)" }

      - name: 保存失败测试诊断
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: client-test-diagnostics
          path: build/ci/*.log
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Windows 前端 / MCP：编译与单元测试
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 准备测试诊断目录
        shell: pwsh
        run: New-Item -ItemType Directory -Path build/ci -Force | Out-Null

      - name: 前端类型检查
        run: pnpm --filter @lyflow/editor typecheck

      - name: 前端编译（桌面应用）
        run: pnpm --filter lyflow-app build

      - name: 前端编译（React 宿主）
        run: pnpm --filter lyflow-host-react build

      - name: 前端单元测试
        shell: pwsh
        run: |
          pnpm --filter @lyflow/editor test 2>&1 | Tee-Object -FilePath build/ci/editor-test.log
          if ($LASTEXITCODE -ne 0) { throw "前端单元测试失败 (exit $LASTEXITCODE)" }

      - name: Shared visualization tests
        shell: pwsh
        run: |
          pnpm --filter @lyflow/visualization test 2>&1 | Tee-Object -FilePath build/ci/visualization-test.log
          if ($LASTEXITCODE -ne 0) { throw "Visualization tests failed (exit $LASTEXITCODE)" }

      - name: MCP 类型检查
        run: pnpm --filter @lyflow/mcp typecheck

      - name: MCP 编译
        run: pnpm --filter @lyflow/mcp build

      - name: MCP 单元测试
        shell: pwsh
        run: |
          pnpm --filter @lyflow/mcp test:unit 2>&1 | Tee-Object -FilePath build/ci/mcp-test.log
          if ($LASTEXITCODE -ne 0) { throw "MCP 单元测试失败 (exit $LASTEXITCODE)" }

      - name: 保存失败测试诊断
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-diagnostics
          path: build/ci/*.log
          if-no-files-found: ignore
          retention-days: 7

  native:
    name: C++ / Rust：编译与单元测试
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
      LYFLOW_STD_PACKS: '0'
      LYFLOW_PACKS: dts;std-value;std-geometry
      LYFLOW_PREBUILT_CORE_DIR: ${{ github.workspace }}/build/core/bin
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 安装 Rust 工具链
        shell: pwsh
        run: |
          $channel = (Select-String -LiteralPath rust-toolchain.toml -Pattern '^channel\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          rustup toolchain install $channel --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust 工具链安装失败' }

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridge
          key: pure-dts
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.16.0

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 桌面前端编译
        run: pnpm --filter lyflow-app build

      - name: C++ 配置（平台 / dts / 值与几何）
        run: cmake -S core -B build/core -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_TOOLCHAIN_FILE= -DLYFLOW_STD_PACKS=OFF "-DLYFLOW_PACKS=dts;std-value;std-geometry" -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON -DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Python SDK 与 worker 测试
        shell: pwsh
        run: |
          python -m pip install -r scripts/requirements.txt
          "LYFLOW_TEST_PYTHON=$((Get-Command python).Source)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'python'
          python -B -m unittest discover -s python/tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Python SDK/worker 测试失败' }

      - name: C++ 编译
        run: cmake --build build/core --config RelWithDebInfo --parallel

      - name: C++ 单元测试（CTest / doctest）
        run: ctest --test-dir build/core -C RelWithDebInfo --output-on-failure --no-tests=error --output-junit "${{ github.workspace }}/build/core/ctest-results.xml"

      - name: Rust 编译（桌面应用与 CLI）
        run: cargo build --locked --manifest-path bridge/Cargo.toml

      - name: Rust 单元测试
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build/ci -Force | Out-Null
          cargo test --locked --manifest-path bridge/Cargo.toml --lib --bins 2>&1 | Tee-Object -FilePath build/ci/bridge-test.log
          if ($LASTEXITCODE -ne 0) { throw "Rust 单元测试失败 (exit $LASTEXITCODE)" }
          cargo test --locked --manifest-path bridge/Cargo.toml --test python_nodes 2>&1 | Tee-Object -FilePath build/ci/python-client-test.log
          if ($LASTEXITCODE -ne 0) { throw "Python CLI/嵌入客户端集成失败 (exit $LASTEXITCODE)" }

      - name: 保存失败构建与测试诊断
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-diagnostics
          path: |
            build/core/ctest-results.xml
            build/core/Testing/Temporary/*.log
            build/core/CMakeFiles/CMakeConfigureLog.yaml
            build/ci/*.log
          if-no-files-found: ignore
          retention-days: 7

  vision:
    name: P0 值 / 几何 / 图像算子与组合流程
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 安装图像依赖
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ninja-build libopencv-dev

      - name: 配置 P0 算子测试
        run: cmake -S core -B build/vision -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE= -DLYFLOW_STD_PACKS=OFF '-DLYFLOW_PACKS=std-value;std-geometry;std-image' -DLYFLOW_PACK_TESTS_ONLY=ON -DCMAKE_POSITION_INDEPENDENT_CODE=ON

      - name: 编译并自检算子契约
        run: |
          cmake --build build/vision --target lyflow-core-tests lyflow-dump-manifest --parallel 2
          build/vision/bin/lyflow-dump-manifest --check

      - name: 验证数值、几何、图像和完整链
        run: ctest --test-dir build/vision --output-on-failure --no-tests=error --output-junit test-results.xml

      - name: 保存失败测试诊断
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vision-test-diagnostics
          path: |
            build/vision/test-results.xml
            build/vision/Testing/Temporary/*.log
            build/vision/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 7
