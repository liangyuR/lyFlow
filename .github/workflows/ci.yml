name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  fast:
    name: 前端 / MCP / Rust 客户端：编译、单元测试与格式
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 安装 Rust 工具链
        shell: pwsh
        run: |
          $channel = (Select-String -LiteralPath rust-toolchain.toml -Pattern '^channel\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          rustup toolchain install $channel --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { throw 'Rust 工具链安装失败' }

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/lyflow-client

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: Rust 格式检查（bridge 与客户端）
        run: cargo fmt --manifest-path bridge/Cargo.toml --all -- --check

      - name: Rust 格式检查（运行库探针）
        run: cargo fmt --manifest-path tests/release/probe/Cargo.toml -- --check

      - name: Rust 客户端编译
        run: cargo build --locked --manifest-path crates/lyflow-client/Cargo.toml

      - name: Rust 客户端单元测试
        run: cargo test --locked --manifest-path crates/lyflow-client/Cargo.toml --lib

      - name: 前端类型检查
        run: pnpm --filter @lyflow/editor typecheck

      - name: 前端编译（桌面应用）
        run: pnpm --filter lyflow-app build

      - name: 前端编译（React 宿主）
        run: pnpm --filter lyflow-host-react build

      - name: 前端单元测试
        run: pnpm --filter @lyflow/editor test

      - name: MCP 类型检查
        run: pnpm --filter @lyflow/mcp typecheck

      - name: MCP 编译
        run: pnpm --filter @lyflow/mcp build

      - name: MCP 单元测试
        run: pnpm --filter @lyflow/mcp test:unit

  native:
    name: C++ / Rust：编译与单元测试
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      LYFLOW_STD_PACKS: '0'
      LYFLOW_PACKS: dts
      LYFLOW_PREBUILT_CORE_DIR: ${{ github.workspace }}/build/core/bin
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 安装 Rust 工具链
        shell: pwsh
        run: |
          $channel = (Select-String -LiteralPath rust-toolchain.toml -Pattern '^channel\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          rustup toolchain install $channel --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust 工具链安装失败' }

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bridge
          key: pure-dts

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 桌面前端编译
        run: pnpm --filter lyflow-app build

      - name: C++ 配置（纯平台 + dts）
        run: cmake -S core -B build/core -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_TOOLCHAIN_FILE= -DLYFLOW_STD_PACKS=OFF -DLYFLOW_PACKS=dts

      - name: C++ 编译
        run: cmake --build build/core --config RelWithDebInfo --parallel

      - name: C++ 单元测试（CTest / doctest）
        run: ctest --test-dir build/core -C RelWithDebInfo --output-on-failure --no-tests=error

      - name: Rust 编译（桌面应用与 CLI）
        run: cargo build --locked --manifest-path bridge/Cargo.toml

      - name: Rust 单元测试
        run: cargo test --locked --manifest-path bridge/Cargo.toml --lib --bins
