name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  quality:
    name: 公共工具格式与契约检查
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 检查 workflow（actionlint 1.7.12）
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install -r scripts/requirements.txt clang-format==20.1.8
      - name: 公共 C++ 宿主示例格式
        run: git ls-files -z -- '*.cpp' '*.h' '*.hpp' | xargs -0 -r clang-format --dry-run --Werror
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: python tests/quality/test_graph_contract_schema.py
      - run: python tests/release/p4_contract.py --schema-only
      - run: python tests/release/p5_contract.py --schema-only
      - shell: pwsh
        run: ./scripts/check.ps1 -Steps schema

  frontend:
    name: Windows 前端 / MCP：编译与单元测试
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 准备测试诊断目录
        shell: pwsh
        run: New-Item -ItemType Directory -Path build/ci -Force | Out-Null

      - name: 前端类型检查
        run: pnpm --filter @lyflow/editor typecheck

      - name: 前端编译（桌面应用）
        run: pnpm --filter lyflow-app build

      - name: 前端编译（React 宿主）
        run: pnpm --filter lyflow-host-react build

      - name: 前端单元测试
        shell: pwsh
        run: |
          pnpm --filter @lyflow/editor test 2>&1 | Tee-Object -FilePath build/ci/editor-test.log
          if ($LASTEXITCODE -ne 0) { throw "前端单元测试失败 (exit $LASTEXITCODE)" }

      - name: Shared visualization tests
        shell: pwsh
        run: |
          pnpm --filter @lyflow/visualization test 2>&1 | Tee-Object -FilePath build/ci/visualization-test.log
          if ($LASTEXITCODE -ne 0) { throw "Visualization tests failed (exit $LASTEXITCODE)" }

      - name: MCP 编译
        run: pnpm --filter @lyflow/mcp build

      - name: MCP 单元测试
        shell: pwsh
        run: |
          pnpm --filter @lyflow/mcp test:unit 2>&1 | Tee-Object -FilePath build/ci/mcp-test.log
          if ($LASTEXITCODE -ne 0) { throw "MCP 单元测试失败 (exit $LASTEXITCODE)" }

      - name: 保存失败测试诊断
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-diagnostics
          path: build/ci/*.log
          if-no-files-found: ignore
          retention-days: 7

  public-tools:
    name: Windows x64 正式 SDK / CLI / MCP / 桌面
    runs-on: windows-2022
    env:
      # CI 的 debug 产物只用来跑测试，保留行号够定位失败，链接和缓存都更小
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements.txt
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 匿名恢复锁定的 SDK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $sdk = ./scripts/restore-native-sdk.ps1 -Destination "$env:RUNNER_TEMP/native-sdk"
          "LYFLOW_NATIVE_SDK=$sdk" >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            bridge
            crates/lyflow-client
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --manifest-path bridge/Cargo.toml --all -- --check
      - run: cargo test --locked --manifest-path crates/lyflow-client/Cargo.toml
      # 类型检查已在 frontend job 跑过，这里只要桌面构建嵌入的 dist
      - run: pnpm --filter lyflow-app exec vite build
      - run: cargo test --locked --manifest-path bridge/Cargo.toml --no-fail-fast
      - run: cargo build --locked --manifest-path bridge/Cargo.toml --features custom-protocol --bin lyflow-app
      - name: CLI、MCP 和实际 WebView2 运行
        shell: pwsh
        run: |
          ./scripts/check.ps1 -Steps manifest,cli,mcp
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:LYFLOW_E2E_BIN_DIR = (Resolve-Path bridge/target/debug).Path
          pnpm e2e:packaged --only noderun:suiteSmart
      - shell: pwsh
        run: ./tests/release/test-runtime-nuget-publish.ps1
