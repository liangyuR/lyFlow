name: Windows release

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  abi-audit:
    name: Compare cached PCL ABI inputs
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download cached packages and extract ABI evidence
        shell: pwsh
        env:
          NUGET_AUDIT_TOKEN: ${{ github.token }}
          NUGET_AUDIT_USER: ${{ github.actor }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'build/abi-audit/evidence'
          $downloads = Join-Path $env:RUNNER_TEMP 'lyflow-abi-packages'
          New-Item -ItemType Directory -Path $evidence, $downloads -Force | Out-Null
          $nuget = (Get-Command nuget.exe -ErrorAction Stop).Source
          $identity = [ordered]@{
            powershell = $PSVersionTable.PSVersion.ToString()
            powershellPath = (Get-Process -Id $PID).Path
            runnerImage = $env:ImageOS
            runnerImageVersion = $env:ImageVersion
            nuget = $nuget
          }
          $identity | ConvertTo-Json | Tee-Object -FilePath (Join-Path $evidence 'environment.json')
          $config = Join-Path $downloads 'nuget.config'
          @'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="lyflow-audit" value="https://nuget.pkg.github.com/liangyuR/index.json" />
            </packageSources>
            <packageSourceCredentials>
              <lyflow-audit>
                <add key="Username" value="%NUGET_AUDIT_USER%" />
                <add key="ClearTextPassword" value="%NUGET_AUDIT_TOKEN%" />
              </lyflow-audit>
            </packageSourceCredentials>
          </configuration>
          '@ | Set-Content -LiteralPath $config -Encoding utf8NoBOM
          $packages = @(
            @{ label = 'old'; version = '1.15.1-vcpkgdd91614e76233881a8bd5916fe08b100f6f502848fd189e416b34022fabf2857' },
            @{ label = 'new'; version = '1.15.1-vcpkg9353061669f350e8e7168f24330c96bcdcb03588ec5f67a92ddef39df3ba8e0b' }
          )
          $results = @()
          foreach ($package in $packages) {
            $destination = Join-Path $downloads $package.label
            $output = & $nuget install pcl_x64-windows -Version $package.version -ConfigFile $config -OutputDirectory $destination -ExcludeVersion -PreRelease -PackageSaveMode nupkg -DirectDownload -NoHttpCache -NonInteractive -ForceEnglishOutput -Verbosity normal 2>&1
            $exitCode = $LASTEXITCODE
            $safeOutput = ($output | Out-String).Replace($env:NUGET_AUDIT_TOKEN, '***')
            $safeOutput | Tee-Object -FilePath (Join-Path $evidence "$($package.label)-download.log")
            $files = @(Get-ChildItem -LiteralPath $destination -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -like '*abi_info*' })
            foreach ($file in $files) {
              $relative = [IO.Path]::GetRelativePath($destination, $file.FullName)
              $target = Join-Path (Join-Path $evidence $package.label) $relative
              New-Item -ItemType Directory -Path (Split-Path -Parent $target) -Force | Out-Null
              Copy-Item -LiteralPath $file.FullName -Destination $target
              Write-Host "$($package.label): $relative"
              Get-Content -LiteralPath $file.FullName
            }
            $results += [pscustomobject]@{ label = $package.label; version = $package.version; exitCode = $exitCode; abiFiles = $files.Count }
          }
          $results | ConvertTo-Json | Tee-Object -FilePath (Join-Path $evidence 'results.json')
          $old = Get-ChildItem -LiteralPath (Join-Path $evidence 'old') -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -like '*abi_info*' } | Select-Object -First 1
          $new = Get-ChildItem -LiteralPath (Join-Path $evidence 'new') -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -like '*abi_info*' } | Select-Object -First 1
          if ($old -and $new) {
            Compare-Object (Get-Content -LiteralPath $old.FullName) (Get-Content -LiteralPath $new.FullName) | Format-Table -AutoSize | Out-String -Width 300 | Tee-Object -FilePath (Join-Path $evidence 'abi-diff.txt')
          }
          if (-not $new) { throw 'New PCL package ABI evidence was unavailable; see saved download log.' }

      - name: Save ABI evidence without credentials or package binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcl-abi-audit
          path: build/abi-audit/evidence/
          if-no-files-found: error
          retention-days: 14
