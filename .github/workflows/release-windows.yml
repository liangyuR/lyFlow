name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inputs:
    name: 读取已复核的引擎资产
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.select.outputs.version }}
      engine: ${{ steps.select.outputs.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        shell: pwsh
        run: |
          . ./scripts/release-common.ps1
          $version = Get-ReleaseVersion -Root $PWD
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag and tool version differ.' }
            git merge-base --is-ancestor HEAD "origin/${{ github.event.repository.default_branch }}"
            if ($LASTEXITCODE) { throw 'Release tag must belong to the default branch history.' }
          }
          $engine = (Get-ReviewedEngineRelease -Root $PWD).Version
          "version=$version" >> $env:GITHUB_OUTPUT
          "engine=$engine" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: 校验锁定的 SDK、runtime 与 NuGet
        shell: pwsh
        env:
          ENGINE: ${{ steps.select.outputs.engine }}
        run: |
          . ./scripts/reviewed-engine-release.ps1
          $lock = Get-ReviewedEngineRelease -Version $env:ENGINE
          $published = Get-PublishedEngineRelease -Release $lock
          $dir = Join-Path $env:RUNNER_TEMP 'engine-assets'
          [void][IO.Directory]::CreateDirectory($dir)
          foreach ($name in $lock.Assets.Keys) {
            Invoke-WebRequest -Uri $lock.Assets[$name].url -OutFile (Join-Path $dir $name)
          }
          Assert-ReviewedEngineAssets -Release $lock -Directory $dir
          "Engine assets from $($published.html_url)"
      - uses: actions/upload-artifact@v4
        with:
          name: engine-assets
          path: ${{ runner.temp }}/engine-assets/
          if-no-files-found: error
          retention-days: 14

  tools:
    name: 构建并运行公共 CLI 与编辑器发行包
    needs: inputs
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: engine-assets
          path: ${{ runner.temp }}/engine-assets
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements.txt
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: 打包并从外部宿主验证正式工具产物
        shell: pwsh
        env:
          ENGINE: ${{ needs.inputs.outputs.engine }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "engine-assets/lyflow-native-sdk-win-x64-v$env:ENGINE.zip"
          $out = Join-Path $env:RUNNER_TEMP 'public-tools'
          ./scripts/package-windows.ps1 -Archive $archive -OutputDir $out
          ./tests/release/test-public-tools.ps1 -AssetsDir $out
      - uses: actions/upload-artifact@v4
        with:
          name: public-tools
          path: ${{ runner.temp }}/public-tools/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: 创建正式版本的 Release 草稿
    needs: [inputs, tools]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
          path: release
      - name: 发布原始引擎资产及同版工具
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE: ${{ needs.inputs.outputs.engine }}
          VERSION: ${{ needs.inputs.outputs.version }}
        run: |
          . ./scripts/reviewed-engine-release.ps1
          $lock = Get-ReviewedEngineRelease -Version $env:ENGINE
          Assert-ReviewedEngineAssets -Release $lock -Directory release
          $tag = "v$env:VERSION"
          $names = @("lyflow-sdk-win-x64-$tag.zip", "lyflow-editor-$tag.tgz", 'lyflow-runtime.json')
          if ($env:VERSION -ceq $env:ENGINE) { $names += @($lock.Assets.Keys) }
          $files = foreach ($name in $names) { (Get-Item -LiteralPath "release/$name" -ErrorAction Stop).FullName }
          $origin = Get-PublishedEngineRelease -Release $lock
          $notes = "Windows x64 完整 SDK（含 CLI）与 React 编辑器。工具修订 $env:GITHUB_SHA。引擎 $env:ENGINE 的运行库、原生 SDK 和 NuGet 见  $($origin.html_url) 。引擎修订 $($lock.Revision)。"
          gh release create $tag @files --verify-tag --draft --title "lyFlow $tag Windows x64" --notes $notes
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
