name: Windows release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  build:
    name: 完整 Windows x64 构建
    permissions:
      contents: read
    runs-on: windows-2022
    timeout-minutes: 350
    outputs:
      version: ${{ steps.source.outputs.version }}
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 核对版本 tag 与 main 历史
        id: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "不支持的产品版本: $version" }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -cne "v$version") { throw 'tag 与产品版本不一致' }
            git merge-base --is-ancestor HEAD origin/main
            if ($LASTEXITCODE -ne 0) { throw '版本 tag 必须指向 main 历史中的提交' }
          }
          $revision = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw '无法读取源码修订' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "revision=$revision" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Python 依赖
        run: python -m pip install -r scripts/requirements.txt

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 依赖缓存身份
        id: native-cache
        shell: pwsh
        run: |
          $configuration = Get-Content -LiteralPath packaging/release.json -Raw | ConvertFrom-Json
          $baseline = $configuration.vcpkgBaseline
          $toolset = "$env:VCToolsVersion".Trim().TrimEnd('\')
          if ($baseline -notmatch '^[0-9a-f]{40}$') { throw '发布配置缺少固定 vcpkg baseline' }
          if ($toolset -notmatch '^\d+\.\d+\.\d+$') { throw '无法识别当前 MSVC toolset' }
          "baseline=$baseline" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "toolset=$toolset" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: actions/cache@v4
        with:
          path: build/release-deps/binary-cache
          key: windows-2022-x64-msvc-${{ steps.native-cache.outputs.toolset }}-vcpkg-${{ steps.native-cache.outputs.baseline }}-std-glue-v1

      - name: 固定 Rust 工具链
        shell: pwsh
        run: |
          $channel = (Select-String -LiteralPath rust-toolchain.toml -Pattern '^channel\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if (-not $channel) { throw '未声明 Rust 工具链' }
          rustup toolchain install $channel --profile minimal --component clippy,rustfmt
          if ($LASTEXITCODE -ne 0) { throw '安装 Rust 工具链失败' }
          rustc --version

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: 同一本地入口构建、测试和打包
        shell: pwsh
        run: |
          $arguments = @('-OutputDir', (Join-Path $env:RUNNER_TEMP 'lyflow-release'))
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $arguments += @('-ExpectedTag', $env:GITHUB_REF_NAME) }
          pnpm run package @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Windows 发包门禁失败' }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            ${{ runner.temp }}/lyflow-release/*.zip
            ${{ runner.temp }}/lyflow-release/*.json
          if-no-files-found: error
          retention-days: 14

  verify:
    name: 独立 Windows runner 解压消费验收
    permissions:
      contents: read
    needs: build
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 固定 Rust 工具链
        shell: pwsh
        run: |
          $channel = (Select-String -LiteralPath rust-toolchain.toml -Pattern '^channel\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if (-not $channel) { throw '未声明 Rust 工具链' }
          rustup toolchain install $channel --profile minimal
          if ($LASTEXITCODE -ne 0) { throw '安装 Rust 工具链失败' }

      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: ${{ runner.temp }}/验收 包

      - name: 验证最终 ZIP
        shell: pwsh
        run: |
          ./scripts/test-release.ps1 -ArchiveDir (Join-Path $env:RUNNER_TEMP '验收 包') -ReportPath (Join-Path $env:RUNNER_TEMP 'release-verification.json')
          if ($LASTEXITCODE -ne 0) { throw '独立消费验收失败' }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-release-verification
          path: ${{ runner.temp }}/release-verification.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: 创建草稿 Release
    needs: [build, verify]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release

      - uses: actions/download-artifact@v4
        with:
          name: windows-release-verification
          path: release

      - name: 创建草稿且不覆盖已有资产
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          SOURCE_REVISION: ${{ needs.build.outputs.revision }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const version = process.env.RELEASE_VERSION;
            const revision = process.env.SOURCE_REVISION;
            const tag = `v${version}`;
            if (context.ref !== `refs/tags/${tag}`) throw new Error('tag 与构建版本不一致');
            const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            if (releases.some(release => release.tag_name === tag)) throw new Error(`Release ${tag} 已存在；禁止覆盖`);
            const files = fs.readdirSync('release').filter(name => /\.(zip|json)$/.test(name));
            for (const name of [`lyflow-runtime-win-x64-v${version}.zip`, `lyflow-sdk-win-x64-v${version}.zip`, 'release-verification.json']) {
              if (!files.includes(name)) throw new Error(`缺少已验收资产: ${name}`);
            }
            const repository = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`;
            const body = [
              `Windows x64 运行库与 SDK/CLI ${tag}。人工复核后正式发布。`,
              '',
              `源码修订：\`${revision}\`。ABI、算子及依赖版本见随包 \`lyflow-runtime.json\`；独立消费验收报告见附件。`,
              '',
              '固定算子包：std-pointcloud、std-image、std-ml、glue。ONNX Runtime 使用 CPU 版；不含 gap、dts、客户模型、桌面安装程序或调试符号。',
              '',
              'Rust 客户端使用同一修订：',
              '```toml',
              `lyflow-client = { git = "${repository}.git", rev = "${revision}" }`,
              '```',
              '',
              '软件验收覆盖最终 ZIP 解压、ABI/版本/算子、合成数据、CLI 和外部 SDK 消费。客户图像效果、真实设备、现场节拍及 GlueSight 安装验收不属于本次软件报告。',
              '',
              '下游固定正式发布的 tag 与资产名；依赖或二进制变化必须增加产品版本，不覆盖旧资产。'
            ].join('\n');
            const { data: release } = await github.rest.repos.createRelease({
              ...context.repo, tag_name: tag, target_commitish: revision,
              name: `lyFlow ${tag} Windows x64`, body, draft: true, prerelease: false,
              make_latest: 'false'
            });
            for (const name of files.sort()) {
              const data = fs.readFileSync(path.join('release', name));
              await github.rest.repos.uploadReleaseAsset({ ...context.repo, release_id: release.id, name, data });
            }
