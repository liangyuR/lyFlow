name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      rebuild_deps:
        description: 显式允许缺失依赖编译并补全 NuGet 缓存；默认只恢复二进制
        type: boolean
        default: false
      dependencies_only:
        description: 只准备依赖并验证空目录从 NuGet 恢复，不构建或发布产品
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  deps:
    name: 固定发布依赖（vcpkg 二进制缓存）
    # 只准备固定第三方依赖；只有这个 job 获得 NuGet 缓存写权限，产品构建 job 仍然只读。
    permissions:
      contents: read
      packages: write
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 依赖缓存身份
        id: native-cache
        shell: pwsh
        run: |
          $configuration = Get-Content -LiteralPath packaging/release.json -Raw | ConvertFrom-Json
          $baseline = $configuration.vcpkgBaseline
          $onnxVersion = $configuration.onnxruntimeVersion
          $toolset = $configuration.dependencyToolchain.msvcToolset
          $windowsSdk = $configuration.dependencyToolchain.windowsSdk
          if ($baseline -notmatch '^[0-9a-f]{40}$') { throw '发布配置缺少固定 vcpkg baseline' }
          if ($toolset -notmatch '^\d+\.\d+\.\d+$') { throw '发布配置缺少固定 MSVC toolset' }
          if ($windowsSdk -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw '发布配置缺少固定 Windows SDK' }
          if ($onnxVersion -notmatch '^\d+\.\d+\.\d+$') { throw '发布配置缺少固定 ONNX Runtime 版本' }
          "onnx-version=$onnxVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "baseline=$baseline" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "toolset=$toolset" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "windows-sdk=$windowsSdk" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: ${{ steps.native-cache.outputs.toolset }}
          sdk: ${{ steps.native-cache.outputs.windows-sdk }}

      - name: 恢复固定版本 vcpkg 工具
        uses: actions/cache/restore@v4
        id: vcpkg-tool-cache-restore
        with:
          path: |
            build/release-tools/vcpkg/*
            !build/release-tools/vcpkg/downloads/**
            !build/release-tools/vcpkg/buildtrees/**
            !build/release-tools/vcpkg/packages/**
            !build/release-tools/vcpkg/installed/**
          key: vcpkg-tool-windows-x64-${{ steps.native-cache.outputs.baseline }}-v1

      - uses: actions/cache/restore@v4
        id: native-cache-restore
        if: ${{ !inputs.rebuild_deps }}
        with:
          path: build/release-deps/binary-cache
          key: windows-2022-x64-msvc-${{ steps.native-cache.outputs.toolset }}-sdk-${{ steps.native-cache.outputs.windows-sdk }}-vcpkg-${{ steps.native-cache.outputs.baseline }}-locked-tools-v1-public-kernels-three-solutions-v7
          restore-keys: |
            windows-2022-x64-msvc-${{ steps.native-cache.outputs.toolset }}-sdk-${{ steps.native-cache.outputs.windows-sdk }}-vcpkg-${{ steps.native-cache.outputs.baseline }}-locked-tools-v1-

      - uses: actions/cache/restore@v4
        id: onnx-cache-restore
        with:
          path: third_party/onnxruntime/onnxruntime-win-x64-${{ steps.native-cache.outputs.onnx-version }}
          key: onnxruntime-win-x64-cpu-${{ steps.native-cache.outputs.onnx-version }}-v1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 恢复固定 OpenCV 源码与安装
        uses: actions/cache/restore@v4
        id: vision-cache
        if: ${{ !inputs.rebuild_deps }}
        with:
          path: |
            build/vision-deps
            build/opencv5-install
          key: opencv5-windows-x64-msvc-${{ steps.native-cache.outputs.toolset }}-sdk-${{ steps.native-cache.outputs.windows-sdk }}-${{ hashFiles('packaging/vision-deps.json', 'scripts/build-vision-deps.ps1', 'scripts/fetch-vision-deps.py', 'scripts/fetch-matching-deps.py') }}-v1

      - name: 准备并验证固定发布依赖
        shell: pwsh
        env:
          LYFLOW_VCPKG_FEED_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LYFLOW_VCPKG_FEED_USER: ${{ github.actor }}
          LYFLOW_VCPKG_FEED_MODE: ${{ inputs.rebuild_deps && 'readwrite' || 'read' }}
          LYFLOW_ALLOW_DEPENDENCY_BUILD: ${{ inputs.rebuild_deps && 'true' || 'false' }}
        run: |
          ./scripts/prepare-release-deps.ps1 -AllowBuild:($env:LYFLOW_ALLOW_DEPENDENCY_BUILD -eq 'true') -SkipVisionBuild:('${{ steps.vision-cache.outputs.cache-hit }}' -eq 'true')
          ./tests/release/test-build-vision-deps.ps1

      - name: 空目录验证 NuGet 二进制恢复
        if: ${{ inputs.rebuild_deps || inputs.dependencies_only }}
        shell: pwsh
        env:
          LYFLOW_VCPKG_FEED_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LYFLOW_VCPKG_FEED_USER: ${{ github.actor }}
          LYFLOW_VCPKG_FEED_MODE: read
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP 'lyflow-nuget-proof-installed'
          $binaryCache = Join-Path $env:RUNNER_TEMP 'lyflow-nuget-proof-cache'
          if ((Test-Path -LiteralPath $installRoot) -or (Test-Path -LiteralPath $binaryCache)) { throw 'NuGet 验证目录必须为空' }
          ./scripts/prepare-release-deps.ps1 -InstallRoot $installRoot -BinaryCache $binaryCache -DiagnosticsName nuget-proof -SkipVisionBuild:('${{ steps.vision-cache.outputs.cache-hit }}' -eq 'true')

      - name: 保存已验证的 vcpkg 工具
        uses: actions/cache/save@v4
        if: steps.vcpkg-tool-cache-restore.outputs.cache-hit != 'true'
        with:
          path: |
            build/release-tools/vcpkg/*
            !build/release-tools/vcpkg/downloads/**
            !build/release-tools/vcpkg/buildtrees/**
            !build/release-tools/vcpkg/packages/**
            !build/release-tools/vcpkg/installed/**
          key: ${{ steps.vcpkg-tool-cache-restore.outputs.cache-primary-key }}

      - name: 保存完整 vcpkg 缓存
        uses: actions/cache/save@v4
        if: steps.native-cache-restore.outputs.cache-hit != 'true'
        with:
          path: build/release-deps/binary-cache
          key: windows-2022-x64-msvc-${{ steps.native-cache.outputs.toolset }}-sdk-${{ steps.native-cache.outputs.windows-sdk }}-vcpkg-${{ steps.native-cache.outputs.baseline }}-locked-tools-v1-public-kernels-three-solutions-v7

      - name: 保存 ONNX Runtime 缓存
        uses: actions/cache/save@v4
        if: steps.onnx-cache-restore.outputs.cache-hit != 'true'
        with:
          path: third_party/onnxruntime/onnxruntime-win-x64-${{ steps.native-cache.outputs.onnx-version }}
          key: ${{ steps.onnx-cache-restore.outputs.cache-primary-key }}

      - name: 保存已验证的 OpenCV 安装
        uses: actions/cache/save@v4
        if: steps.vision-cache.outputs.cache-hit != 'true'
        with:
          path: |
            build/vision-deps
            build/opencv5-install
          key: opencv5-windows-x64-msvc-${{ steps.native-cache.outputs.toolset }}-sdk-${{ steps.native-cache.outputs.windows-sdk }}-${{ hashFiles('packaging/vision-deps.json', 'scripts/build-vision-deps.ps1', 'scripts/fetch-vision-deps.py', 'scripts/fetch-matching-deps.py') }}-v1

      - name: 保存依赖 ABI 诊断
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-deps-diagnostics
          path: |
            build/release-dependency-diagnostics/
            build/vision-opencv/*.log
          if-no-files-found: warn
          retention-days: 14

  build:
    name: 完整 Windows x64 构建
    needs: deps
    if: ${{ !inputs.dependencies_only }}
    permissions:
      contents: read
      packages: read
    runs-on: windows-2022
    timeout-minutes: 350
    outputs:
      version: ${{ steps.source.outputs.version }}
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 核对版本 tag 与 main 历史
        id: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "不支持的产品版本: $version" }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -cne "v$version") { throw 'tag 与产品版本不一致' }
            git merge-base --is-ancestor HEAD origin/main
            if ($LASTEXITCODE -ne 0) { throw '版本 tag 必须指向 main 历史中的提交' }
          }
          $revision = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw '无法读取源码修订' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "revision=$revision" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Python 依赖
        run: python -m pip install -r scripts/requirements.txt

      - name: 依赖缓存身份
        id: native-cache
        shell: pwsh
        run: |
          $configuration = Get-Content -LiteralPath packaging/release.json -Raw | ConvertFrom-Json
          $baseline = $configuration.vcpkgBaseline
          $onnxVersion = $configuration.onnxruntimeVersion
          $toolset = $configuration.dependencyToolchain.msvcToolset
          $windowsSdk = $configuration.dependencyToolchain.windowsSdk
          if ($baseline -notmatch '^[0-9a-f]{40}$') { throw '发布配置缺少固定 vcpkg baseline' }
          if ($toolset -notmatch '^\d+\.\d+\.\d+$') { throw '发布配置缺少固定 MSVC toolset' }
          if ($windowsSdk -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw '发布配置缺少固定 Windows SDK' }
          if ($onnxVersion -notmatch '^\d+\.\d+\.\d+$') { throw '发布配置缺少固定 ONNX Runtime 版本' }
          "onnx-version=$onnxVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "baseline=$baseline" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "toolset=$toolset" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "windows-sdk=$windowsSdk" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: ${{ steps.native-cache.outputs.toolset }}
          sdk: ${{ steps.native-cache.outputs.windows-sdk }}

      - name: 恢复固定版本 vcpkg 工具
        uses: actions/cache/restore@v4
        id: vcpkg-tool-cache-restore
        with:
          path: |
            build/release-tools/vcpkg/*
            !build/release-tools/vcpkg/downloads/**
            !build/release-tools/vcpkg/buildtrees/**
            !build/release-tools/vcpkg/packages/**
            !build/release-tools/vcpkg/installed/**
          key: vcpkg-tool-windows-x64-${{ steps.native-cache.outputs.baseline }}-v1

      - uses: actions/cache/restore@v4
        id: native-cache-restore
        with:
          path: build/release-deps/binary-cache
          key: windows-2022-x64-msvc-${{ steps.native-cache.outputs.toolset }}-sdk-${{ steps.native-cache.outputs.windows-sdk }}-vcpkg-${{ steps.native-cache.outputs.baseline }}-locked-tools-v1-public-kernels-three-solutions-v7
          restore-keys: |
            windows-2022-x64-msvc-${{ steps.native-cache.outputs.toolset }}-sdk-${{ steps.native-cache.outputs.windows-sdk }}-vcpkg-${{ steps.native-cache.outputs.baseline }}-locked-tools-v1-

      - uses: actions/cache/restore@v4
        id: onnx-cache-restore
        with:
          path: third_party/onnxruntime/onnxruntime-win-x64-${{ steps.native-cache.outputs.onnx-version }}
          key: onnxruntime-win-x64-cpu-${{ steps.native-cache.outputs.onnx-version }}-v1

      - name: 固定 Rust 工具链
        shell: pwsh
        run: |
          $channel = (Select-String -LiteralPath rust-toolchain.toml -Pattern '^channel\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if (-not $channel) { throw '未声明 Rust 工具链' }
          rustup toolchain install $channel --profile minimal --component clippy,rustfmt
          if ($LASTEXITCODE -ne 0) { throw '安装 Rust 工具链失败' }
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            bridge -> ../build/release-rust
            tests/release/probe -> ../../../build/release-probes/probe
          key: windows-release-${{ hashFiles('packaging/release.json') }}

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: 恢复固定 OpenCV 源码与安装
        uses: actions/cache/restore@v4
        id: vision-cache
        with:
          path: |
            build/vision-deps
            build/opencv5-install
          key: opencv5-windows-x64-msvc-${{ steps.native-cache.outputs.toolset }}-sdk-${{ steps.native-cache.outputs.windows-sdk }}-${{ hashFiles('packaging/vision-deps.json', 'scripts/build-vision-deps.ps1', 'scripts/fetch-vision-deps.py', 'scripts/fetch-matching-deps.py') }}-v1

      - name: 准备并验证固定发布依赖
        shell: pwsh
        env:
          LYFLOW_VCPKG_FEED_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LYFLOW_VCPKG_FEED_USER: ${{ github.actor }}
        run: ./scripts/prepare-release-deps.ps1 -SkipVisionBuild:('${{ steps.vision-cache.outputs.cache-hit }}' -eq 'true')

      - name: 同一本地入口构建、测试和打包
        shell: pwsh
        env:
          LYFLOW_VCPKG_FEED_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LYFLOW_VCPKG_FEED_USER: ${{ github.actor }}
        run: |
          $arguments = @('-OutputDir', (Join-Path $env:RUNNER_TEMP 'lyflow-release'))
          if ('${{ steps.vision-cache.outputs.cache-hit }}' -eq 'true') { $arguments += '-SkipVisionBuild' }
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $arguments += @('-ExpectedTag', $env:GITHUB_REF_NAME) }
          pnpm run package @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            ${{ runner.temp }}/lyflow-release/*.zip
            ${{ runner.temp }}/lyflow-release/*.json
            ${{ runner.temp }}/lyflow-release/*.tgz
            ${{ runner.temp }}/lyflow-release/*.nupkg
          if-no-files-found: error
          retention-days: 14

      - name: 保存构建与暂存诊断
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-build-diagnostics
          path: |
            build/release-stage/*.json
            build/release-stage/*.log
            build/release-diagnostics/*.log
            build/release-core/**/*.log
            build/release-core/ctest-results.xml
            build/release-dependency-diagnostics/
            build/vision-opencv/*.log
          if-no-files-found: warn
          retention-days: 7

  public-tools:
    name: 从原生 SDK 构建公共工具
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /app/
            /bridge/
            /crates/lyflow-client/
            /examples/host-react/
            /packages/
            /docs/agent-tuning.md
            /docs/http-transport.md
            /docs/mcp-glue-tuning.md
            /packs/*/README.md
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: ${{ runner.temp }}/engine-assets
      - name: 解压本次构建的 SDK
        shell: pwsh
        env:
          ENGINE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP 'native-sdk'
          $zip = Join-Path $env:RUNNER_TEMP "engine-assets/lyflow-native-sdk-win-x64-v$env:ENGINE_VERSION.zip"
          [IO.Compression.ZipFile]::ExtractToDirectory($zip, $sdk)
          Copy-Item "$sdk/schema" schema -Recurse
          Copy-Item "$sdk/examples/m3-native-profile.lyflow.json","$sdk/examples/m3-native-profile.csv" -Destination examples
          "LYFLOW_NATIVE_SDK=$sdk" >> $env:GITHUB_ENV
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: 构建桌面工具并用 CLI 执行随包示例
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm --filter lyflow-app build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked --manifest-path bridge/Cargo.toml --bin lyflow-app --features custom-protocol
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked --manifest-path bridge/Cargo.toml --no-default-features --bin lyflow
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path bridge/Cargo.toml --no-default-features --test profiles lypr
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $cli = (Resolve-Path bridge/target/debug/lyflow.exe).Path
          & $cli manifest --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $lines = @(& $cli run "$env:LYFLOW_NATIVE_SDK/examples/p2-expression.lyflow.json" --summary)
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $result = $lines[-1] | ConvertFrom-Json
          if ($result.status -cne 'ok' -or $result.outputs.mean.state -cne 'value') { throw 'CLI 未返回示例输出' }
          "LYFLOW_CLI=$cli" >> $env:GITHUB_ENV
      - name: 通过 MCP 读取实际执行结果
        shell: pwsh
        run: |
          pnpm --filter @lyflow/mcp build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm --filter @lyflow/mcp test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  publish:
    name: 创建草稿 Release
    needs: [build, public-tools]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            packaging/engine-releases
            scripts/reviewed-engine-release.ps1
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release

      - name: 校验双仓发行的原始资产
        id: reviewed
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          . ./scripts/reviewed-engine-release.ps1
          $lock = Get-ReviewedEngineRelease -Version $env:RELEASE_VERSION
          if ($lock) {
            Assert-ReviewedEngineAssets -Release $lock -Directory release
            "revision=$($lock.Revision)" >> $env:GITHUB_OUTPUT
            "files=$(ConvertTo-Json -InputObject @($lock.Assets.Keys) -Compress)" >> $env:GITHUB_OUTPUT
          }

      - name: 创建草稿且不覆盖已有资产
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          SOURCE_REVISION: ${{ needs.build.outputs.revision }}
          ENGINE_REVISION: ${{ steps.reviewed.outputs.revision }}
          ENGINE_FILES: ${{ steps.reviewed.outputs.files }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const version = process.env.RELEASE_VERSION;
            const revision = process.env.SOURCE_REVISION;
            const tag = `v${version}`;
            if (context.ref !== `refs/tags/${tag}`) throw new Error('tag 与构建版本不一致');
            const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            if (releases.some(release => release.tag_name === tag)) throw new Error(`Release ${tag} 已存在；禁止覆盖`);
            const reviewed = process.env.ENGINE_REVISION;
            const files = reviewed ? JSON.parse(process.env.ENGINE_FILES) : fs.readdirSync('release').filter(name => /\.(zip|json|tgz|nupkg)$/.test(name));
            if (!reviewed) {
              const required = [`lyflow-runtime-win-x64-v${version}.zip`, `lyflow-native-sdk-win-x64-v${version}.zip`, `lyflow-sdk-win-x64-v${version}.zip`, `lyflow-editor-v${version}.tgz`, `LyFlow.Runtime.win-x64.${version}.nupkg`, 'lyflow-runtime.json'];
              for (const name of required) {
                if (!fs.existsSync(path.join('release', name))) throw new Error(`缺少构建资产: ${name}`);
              }
            }
            const repository = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`;
            const runtimeContract = reviewed ? null : JSON.parse(fs.readFileSync('release/lyflow-runtime.json', 'utf8'));
            const body = reviewed ? `Windows x64 运行库、原生 SDK 和 NuGet ${tag}。引擎来源为 liangyuR/lyflow-engine 的 \`${reviewed}\`，公开 tag 对应工具仓修订 \`${revision}\`。` : [
              `Windows x64 运行库、SDK/CLI 与节点图编辑器 ${tag}。人工复核后正式发布。`,
              '',
              `源码修订：\`${revision}\`。ABI、算子及依赖版本见随包 \`lyflow-runtime.json\`。`,
              '',
              `固定算子包：${runtimeContract.packs.map(pack => pack.name).join('、')}。显式能力模块：${runtimeContract.modules.join('、')}。ONNX Runtime 使用 CPU 版。运行库和 SDK 不附客户模型、桌面安装程序或调试符号。`,
              '',
              `\`lyflow-editor-v${version}.tgz\` 是 \`@lyflow/editor\` 的 TypeScript 源码包（npm pack），宿主按 tarball 依赖安装、用自己的打包器编译。`,
              '',
              'Rust 客户端使用同一修订：',
              '```toml',
              `lyflow-client = { git = "${repository}.git", rev = "${revision}" }`,
              '```',
              '',
