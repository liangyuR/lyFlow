[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lyflow-python"
version = "1.3.5"
description = "LyFlow custom Python node SDK and worker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["."]
include = ["lyflow_python*"]
