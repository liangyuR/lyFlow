[package]
# 包名就是桌面壳那个 bin 的名字：tauri build 按**包名**去找刚编出来的 exe，
# 再把它改名成 mainBinaryName。叫 lyflow 的话它会把 CLI 改名盖掉 app（ADR-0012）。
name = "lyflow-app"
version = "1.1.0"
edition = "2021"
rust-version = "1.77"
description = "LyFlow 桥接层：IPC、序列化、文件读写、事件推流"
publish = false
# 两个 bin 都显式声明，autobins 会把 src/main.rs 也叫成 lyflow，和 CLI 撞名。
# default-run 是给 `tauri dev` 的：它跑的是不带 --bin 的 cargo run。
autobins = false
default-run = "lyflow-app"

[lib]
name = "lyflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 桌面壳。CLI 不依赖 Tauri，所以它被关在 desktop feature 后面（F6）。
[[bin]]
name = "lyflow-app"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "lyflow"
path = "src/bin/lyflow.rs"

# execution.rs 的测试要 `TensorView::borrowed` 借内存造视图；features 在 cargo test
# 时并集，cargo build 不编 dev-deps，所以生产构建里它仍然不存在。
[dev-dependencies]
lyflow-client = { path = "../crates/lyflow-client", features = ["test-util"] }

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }
cmake = "0.1.58"

[dependencies]
tauri = { version = "2", features = [], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tauri-plugin-dialog = { version = "2", optional = true }
libloading = "0.8.9"
# C ABI 边界那一层（`lyflow/client.hpp` 的 Rust 对应物）。桥接层只在它上面加
# 路径解析、进程单例与热重载 —— 见 core_ffi.rs。
lyflow-client = { path = "../crates/lyflow-client" }
notify = { version = "8.2.0", default-features = false }
# 配方的规格摘要（specDigest，docs/recipe.md §3）。Tauri 本来就间接依赖它，锁文件里的同一个版本。
sha2 = "0.10"

[features]
default = ["desktop"]
# 桌面壳需要的一切。关掉它 `cargo build --bin lyflow` 就完全不碰 Tauri。
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog"]
# Tauri 自定义协议，release 构建需要
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
strip = true
